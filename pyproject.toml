[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlbrace"
version = "0.1.0"
description = "Lightweight Python connector for SQL Server, built on pyodbc."
requires-python = ">=3.9"
dependencies = [
    "pyodbc>=5.0.0",
]

[tool.setuptools.packages.find]
include = ["sqlbrace*"]
